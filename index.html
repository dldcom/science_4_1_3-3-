<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>볼케이노 타이쿤: 퀘스트 마스터</title>
    <style>
        * { cursor: url('glove_point_white_processed.png') 32 32, auto !important; }
        *:active { cursor: url('glove_press_white_processed.png') 32 32, auto !important; }
        
        body { margin: 0; overflow: hidden; background-color: #79C265; font-family: 'Comic Sans MS', 'Jua', sans-serif; user-select: none; touch-action: none; }
        #game-board { position: relative; width: 100vw; height: 100vh; background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 50px 50px; overflow: hidden; }
        
        #night-overlay { position: absolute; width: 100%; height: 100%; background: rgba(10,10,40,0.7); pointer-events: none; z-index: 15000; opacity: 0; transition: opacity 3s; mix-blend-mode: multiply; }

        #volcano { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 250px; height: 250px; background: url('volcano_processed.webp') no-repeat center/contain; cursor: pointer; z-index: 10; transition: transform 0.1s; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3)); }
        #volcano:active { transform: translate(-50%, -50%) scale(0.95); }
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0% { transform: translate(-50%, -50%) rotate(0deg); } 25% { transform: translate(-55%, -45%) rotate(-5deg); } 50% { transform: translate(-45%, -55%) rotate(5deg); } 75% { transform: translate(-55%, -55%) rotate(-5deg); } 100% { transform: translate(-50%, -50%) rotate(0deg); } }

        .particle { position: absolute; width: 60px; height: 60px; cursor: pointer; z-index: 19000; transition: top 1s cubic-bezier(0.25, 1, 0.5, 1), left 1s cubic-bezier(0.25, 1, 0.5, 1); filter: drop-shadow(0 5px 5px rgba(0,0,0,0.4)); }
        .particle:active { transform: scale(0.9); }
        
        .crop, .tourist { position: absolute; font-size: 40px; cursor: pointer; z-index: 19000; animation: bounceIn 0.5s; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.4)); }
        @keyframes bounceIn { 0% { transform: scale(0); } 80% { transform: scale(1.2); } 100% { transform: scale(1); } }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20000; }
        
        #inventory { position: absolute; top: 15px; left: 15px; pointer-events: auto; background: rgba(255,255,255,0.95); padding: 8px 15px; border-radius: 20px; display: flex; flex-wrap: wrap; gap: 10px; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: 2px solid #ddd; }
        .inv-item { display: flex; align-items: center; font-size: 16px; font-weight: bold; background: #eee; padding: 4px 10px; border-radius: 10px; }
        .inv-item img, .inv-item span.icon { width: 25px; height: 25px; margin-right: 5px; font-size: 20px; line-height: 25px; display: inline-block; text-align: center; }
        
        #shop { position: absolute; top: 15px; right: 15px; pointer-events: auto; background: rgba(255,255,255,0.95); padding: 15px; border-radius: 15px; width: 280px; height: 50vh; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: 2px solid #ddd; }
        #quest-panel { position: absolute; top: 55vh; right: 15px; pointer-events: auto; background: rgba(255,250,200,0.95); padding: 15px; border-radius: 15px; width: 280px; height: 35vh; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: 2px solid #E6C229; }
        
        .panel-title { text-align: center; font-weight: bold; font-size: 18px; margin-bottom: 10px; color: #333; border-bottom: 2px solid #ccc; padding-bottom: 5px; }
        
        .shop-item { display: flex; align-items: center; background: #fff; border: 2px solid #ddd; border-radius: 10px; padding: 8px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
        .shop-item:active { transform: scale(0.98); }
        .shop-item .icon-box { width: 45px; height: 45px; display: flex; justify-content: center; align-items: center; font-size: 30px; background: #f5f5f5; border-radius: 8px; margin-right: 10px; }
        .shop-item .icon-box img { max-width: 100%; max-height: 100%; }
        .shop-item .info { flex: 1; }
        .shop-item .name { font-weight: bold; font-size: 13px; color: #333; margin-bottom: 2px; }
        .shop-item .cost { font-size: 11px; color: #666; font-weight: bold; display: flex; flex-wrap: wrap; gap: 4px; }
        .shop-item .cost span { display: flex; align-items: center; }
        .shop-item .cost img { width: 12px; height: 12px; margin-right: 2px; }

        .quest-item { background: #fff; border: 2px dashed #E6C229; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; font-weight: bold; }
        .quest-item.done { background: #d4edda; border-style: solid; border-color: #28a745; color: #155724; text-decoration: line-through; }
        .quest-title { color: #E6C229; margin-bottom: 3px; font-size: 14px; }
        .quest-item.done .quest-title { color: #28a745; }

        .modal-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 30000; display: none; justify-content: center; align-items: center; pointer-events: auto; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-content h2 { color: #FF5722; margin-bottom: 20px; word-break: keep-all; font-size: 22px; }
        .quiz-option { display: block; width: 100%; padding: 12px; margin: 10px 0; font-size: 18px; border: 2px solid #2196F3; background: #E3F2FD; border-radius: 12px; font-weight: bold; transition: all 0.2s; }
        .quiz-option:active { background: #2196F3; color: white; }
        .close-btn { margin-top: 15px; padding: 10px 25px; background: #9e9e9e; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; }

        #dict-btn { position: absolute; top: 80px; left: 15px; pointer-events: auto; background: #9C27B0; color: white; padding: 10px 20px; border-radius: 10px; font-weight: bold; font-size: 18px; border: 3px solid #7B1FA2; box-shadow: 0 4px 0 #4A148C; transition: all 0.1s; }
        #dict-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #4A148C; }
        
        .dict-entry { background: #f3e5f5; border-left: 5px solid #9C27B0; padding: 15px; margin-bottom: 10px; text-align: left; font-size: 16px; font-weight: bold; line-height: 1.4; }

        /* 건축물 기본 속성 */
        .building { position: absolute; user-select: none; touch-action: none; display: flex; justify-content: center; align-items: center; }
        .building.draggable { cursor: grab; }
        .building.draggable:active { cursor: grabbing; filter: brightness(1.1); }
        
        .size-1 { width: 50px; height: 50px; font-size: 30px; }
        .size-2 { width: 100px; height: 100px; font-size: 60px; }
        .size-3 { width: 150px; height: 150px; font-size: 80px; }

        .obj-3d { filter: drop-shadow(0 15px 10px rgba(0,0,0,0.3)); background: rgba(255,255,255,0.5); border: 2px dashed #aaa; border-radius: 10px; }
        .obj-3d.has-img { background: transparent; border: none; }
        .obj-tile { z-index: 5 !important; border: 1px dashed rgba(255,255,255,0.3); }
        
        /* 특수 기능 효과 */
        .lamp-glow { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,220,100,0.8) 0%, rgba(255,200,50,0.4) 40%, transparent 70%); width: 300px; height: 300px; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; opacity: 0; transition: opacity 2s; z-index: 14000; }
        .night-mode .lamp-glow { opacity: 1; }
        
        .oven-fire { position: absolute; bottom: 0; font-size: 40px; animation: flicker 0.5s infinite alternate; pointer-events: none; display: none; }
        @keyframes flicker { 0% { opacity: 0.8; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1.1); } }

        #alert-text { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); font-size: 28px; font-weight: bold; color: white; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; z-index: 40000; opacity: 0; pointer-events: none; transition: opacity 0.4s; text-align: center; line-height: 1.4; }
        
        /* 훈장 표시기 */
        #medals-container { position: absolute; top: 130px; left: 15px; display: flex; gap: 5px; font-size: 30px; pointer-events: none; z-index: 20000;}
    </style>
</head>
<body>
    <div id="game-board">
        <div id="night-overlay"></div>
        <div id="volcano" class="obj-3d has-img" style="width:250px; height:250px;"></div>
        <div id="alert-text"></div>
        
        <div id="ui-layer">
            <div id="inventory">
                <div class="inv-item" title="화산 가스"><img src="gas_processed.webp"><span id="inv-gas">0</span></div>
                <div class="inv-item" title="용암"><img src="lava_processed.webp"><span id="inv-lava">0</span></div>
                <div class="inv-item" title="화산재"><img src="ash_processed.webp"><span id="inv-ash">0</span></div>
                <div class="inv-item" title="화산 암석 조각"><img src="rock_processed.webp"><span id="inv-rock">0</span></div>
                <div class="inv-item" title="수확한 고구마"><span class="icon">🍠</span><span id="inv-potato">0</span></div>
                <div class="inv-item" title="용암 군고구마"><span class="icon">🍕</span><span id="inv-roasted">0</span></div>
                <div class="inv-item" title="누적 관광객 (훈장 조건)"><span class="icon">👦</span><span id="inv-tourists">0</span></div>
            </div>
            
            <button id="dict-btn" onclick="document.getElementById('dict-modal').style.display='flex'">📖 화산 도감</button>
            <div id="medals-container"></div>
            
            <div id="shop">
                <div class="panel-title">상점 (드래그로 겹쳐짓기)</div>
                <div id="shop-items"></div>
            </div>
            
            <div id="quest-panel">
                <div class="panel-title">📜 진행중인 퀘스트</div>
                <div id="quest-items"></div>
            </div>
        </div>
        
        <div id="quiz-modal" class="modal-bg">
            <div class="modal-content">
                <h2 id="quiz-q">질문</h2>
                <div id="quiz-options"></div>
                <button class="close-btn" onclick="document.getElementById('quiz-modal').style.display='none'">닫기</button>
            </div>
        </div>
        
        <div id="dict-modal" class="modal-bg">
            <div class="modal-content">
                <h2>📖 나의 화산 도감</h2>
                <div id="dict-content" style="max-height: 40vh; overflow-y: auto;">
                    <div style="color:#666;">아직 해금된 도감이 없습니다. 퀘스트를 완료해보세요!</div>
                </div>
                <button class="close-btn" onclick="document.getElementById('dict-modal').style.display='none'">닫기</button>
            </div>
        </div>
    </div>

    <script>
        // 초기 자원 (테스트용 넉넉히)
        const inventory = { gas: 200, lava: 200, ash: 200, rock: 200, potato: 0, roasted: 0, tourists: 0 };
        const resTypes = ['gas', 'lava', 'ash', 'rock'];
        
        let placedBuildings = [];
        let quizzesAnswered = 0;
        let dayTick = 0; // 1초마다 증가, 120초 낮, 60초 밤
        let isNight = false;

        const items = {
            hot: { name: '천연 화산 온천', type: '3d', size: 2, img: 'hot_processed.webp', cost: { gas: 15, rock: 10 } },
            harubang: { name: '현무암 조각 공원', type: '3d', size: 2, img: 'harubang_processed.webp', cost: { lava: 10, rock: 20 } },
            farm: { name: '비옥한 화산재 농장', type: '3d', size: 3, img: 'farm_processed.webp', cost: { ash: 25, lava: 5 } },
            castle: { name: '단단한 현무암 성곽', type: '3d', size: 3, img: 'castle_processed.webp', cost: { lava: 20, rock: 25, ash: 5 } },
            wall: { name: '현무암 돌담', type: '3d', size: 1, emoji: '🧱', cost: { rock: 3, ash: 1 } },
            pillar: { name: '주상절리 육각 기둥', type: '3d', size: 1, emoji: '🏛️', cost: { lava: 5, rock: 5 } },
            bomb: { name: '화산탄 조각상', type: '3d', size: 1, emoji: '🍠', cost: { lava: 5, gas: 5 } },
            pond: { name: '부석 미니 연못', type: '3d', size: 2, emoji: '⛲', cost: { gas: 15, rock: 5 } },
            power: { name: '지열 발전소', type: '3d', size: 3, emoji: '🏭', cost: { gas: 30, lava: 10 } },
            oven: { name: '마그마 돌 화덕', type: '3d', size: 2, emoji: '🍕', cost: { lava: 15, rock: 5 } },
            lamp: { name: '현무암 가로등', type: '3d', size: 1, emoji: '🏮', cost: { lava: 3, gas: 5 } },
            crater: { name: '분화구 호수 타일', type: 'tile', size: 3, emoji: '💧', cost: { ash: 5, rock: 5, gas: 5 } },
            sand: { name: '검은 모래 해변 타일', type: 'tile', emoji: '🏖️', size: 2, cost: { ash: 10, rock: 2 } },
            garden: { name: '화산재 텃밭 타일', type: 'tile', size: 3, emoji: '🌱', cost: { ash: 15, gas: 5 } }
        };

        const quests = [
            { id: 'q1', title: '화산의 쉼터', desc: '온천 1개 건설', condition: () => countB('hot') >= 1, done: false, dict: '온천은 마그마에 데워진 솟아나는 물로, 피로를 풀어주고 훌륭한 관광 자원이 됩니다.' },
            { id: 'q2', title: '비옥한 땅의 비밀', desc: '농장에서 고구마 3개 수확', condition: () => inventory.potato >= 3, done: false, dict: '화산재는 초기엔 피해를 주지만, 시간이 지나면 땅을 매우 걸름지게(비옥하게) 만들어 농사가 잘 되게 해줘요.' },
            { id: 'q3', title: '지구의 끓는 피', desc: '화덕에서 군고구마 1번 굽기', condition: () => inventory.roasted >= 1, done: false, dict: '마그마의 엄청난 열기는 지열 발전으로 전기를 만들거나 요리에 활용할 수 있는 소중한 에너지입니다.' },
            { id: 'q4', title: '화산 마을의 인기', desc: '관광객 5명 터치하여 반기기', condition: () => inventory.tourists >= 5, done: false, medal: '🏅', dict: '주상절리나 분화구 등 독특한 화산 지형은 세계적인 관광 명소가 되어 사람들을 끌어모읍니다.' },
            { id: 'q5', title: '척척박사 전문가', desc: '화산 퀴즈 3번 정답', condition: () => quizzesAnswered >= 3, done: false, medal: '🎓', dict: '화산 분출물에는 기체(화산가스), 액체(용암), 고체(화산재, 화산 암석 조각) 3가지 상태가 모두 존재합니다.' },
            { id: 'q6', title: '빛나는 화산의 밤', desc: '가로등을 설치해 밤 밝히기', condition: () => countB('lamp') >= 1 && isNight, done: false, dict: '제주도나 하와이처럼 현무암이 흔한 곳에서는 구멍 뚫린 돌을 가공해 돌담, 조각상 등 다양한 생활용품을 만듭니다.' }
        ];

        const questions = [
            { q: "땅속 깊은 곳에서 암석이 녹은 물질은 무엇일까요?", opts: ["화산 가스", "마그마", "지하수", "화산재"], a: 1 },
            { q: "화산 활동으로 나오는 기체로, 대부분 수증기로 이루어진 것은?", opts: ["산소", "이산화 탄소", "화산 가스", "질소"], a: 2 },
            { q: "마그마가 지표면을 흐르는 것으로, 굳어지면 암석이 되는 것은?", opts: ["용암", "화산재", "지하수", "온천수"], a: 0 },
            { q: "화산 분출물 중 크기가 매우 작고, 땅을 비옥하게 만들어주는 고체 물질은?", opts: ["화산 암석 조각", "마그마", "화산 가스", "화산재"], a: 3 }
        ];

        function countB(type) { return placedBuildings.filter(b => b.type === type).length; }

        function updateUI() {
            Object.keys(inventory).forEach(k => {
                const el = document.getElementById(`inv-${k}`);
                if(el) el.innerText = inventory[k];
            });
            renderQuests();
        }

        function showAlert(msg) {
            const al = document.getElementById('alert-text');
            al.innerHTML = msg;
            al.style.opacity = 1;
            setTimeout(() => { al.style.opacity = 0; }, 2500);
        }

        function renderShop() {
            const container = document.getElementById('shop-items');
            container.innerHTML = '';
            for (let key in items) {
                const it = items[key];
                let costHtml = '';
                for (let c in it.cost) costHtml += `<span><img src="${c}_processed.webp">${it.cost[c]}</span>`;
                let iconHtml = it.img ? `<img src="${it.img}">` : it.emoji;
                
                container.innerHTML += `
                    <div class="shop-item" onclick="buyBuilding('${key}', event)">
                        <div class="icon-box">${iconHtml}</div>
                        <div class="info">
                            <div class="name">${it.name}</div>
                            <div class="cost">${costHtml}</div>
                        </div>
                    </div>
                `;
            }
        }

        function renderQuests() {
            const container = document.getElementById('quest-items');
            container.innerHTML = '';
            let anyUnlocked = false;
            
            quests.forEach(q => {
                if(!q.done && q.condition()) {
                    q.done = true;
                    let msg = `🎉 퀘스트 완료: ${q.title}<br>📖 도감이 새롭게 해금되었습니다!`;
                    if(q.medal) {
                        msg += `<br>${q.medal} 훈장 획득!`;
                        document.getElementById('medals-container').innerHTML += q.medal;
                    }
                    showAlert(msg);
                    
                    if(!anyUnlocked) {
                        document.getElementById('dict-content').innerHTML = '';
                        anyUnlocked = true;
                    }
                    document.getElementById('dict-content').innerHTML += `
                        <div class="dict-entry">
                            <div style="color:#FF5722; font-size:14px;">[${q.title} 달성]</div>
                            ${q.dict}
                        </div>
                    `;
                }
                
                container.innerHTML += `
                    <div class="quest-item ${q.done ? 'done' : ''}">
                        <div class="quest-title">${q.title}</div>
                        ${q.done ? '✅ 완료' : '🔲 ' + q.desc}
                    </div>
                `;
            });
        }

        function updateYSorting(el) {
            if (el.dataset.group === 'tile') {
                el.style.zIndex = 5;
            } else {
                const rect = el.getBoundingClientRect();
                el.style.zIndex = Math.floor(rect.bottom);
            }
        }

        setTimeout(() => updateYSorting(document.getElementById('volcano')), 100);

        // 상호작용 관련 로직
        let isSweeping = false;
        document.addEventListener('mousedown', () => isSweeping = true);
        document.addEventListener('mouseup', () => isSweeping = false);
        document.addEventListener('touchstart', () => isSweeping = true);
        document.addEventListener('touchend', () => isSweeping = false);

        document.addEventListener('touchmove', (e) => {
            if(!isSweeping) return;
            const touch = e.touches[0];
            const el = document.elementFromPoint(touch.clientX, touch.clientY);
            if(el) checkCollection(el);
        });

        function checkCollection(el) {
            if(el.classList.contains('particle') && !el.dataset.collected) {
                el.dataset.collected = "true";
                inventory[el.dataset.res]++;
                el.remove();
                updateUI();
            } else if(el.classList.contains('crop')) {
                inventory.potato++;
                el.remove();
                updateUI();
                showAlert("🍠 고구마 수확!");
            } else if(el.classList.contains('tourist')) {
                inventory.tourists++;
                el.remove();
                updateUI();
                showAlert("👦 관광객 환영!");
            }
        }

        // 마그마 화덕 기능
        function handleOvenClick(ovenEl) {
            if(inventory.potato >= 1 && !ovenEl.dataset.baking) {
                inventory.potato--;
                updateUI();
                ovenEl.dataset.baking = "true";
                ovenEl.querySelector('.oven-fire').style.display = 'block';
                showAlert("🔥 고구마를 굽는 중... (10초)");
                
                setTimeout(() => {
                    ovenEl.dataset.baking = "";
                    ovenEl.querySelector('.oven-fire').style.display = 'none';
                    inventory.roasted++;
                    updateUI();
                    showAlert("🍕 용암 군고구마 완성!");
                    
                    const p = document.createElement('div');
                    p.className = 'crop';
                    p.innerText = '🍕';
                    p.style.left = (parseInt(ovenEl.style.left) + ovenEl.offsetWidth/2 - 20) + 'px';
                    p.style.top = (parseInt(ovenEl.style.top) - 40) + 'px';
                    document.getElementById('game-board').appendChild(p);
                    setTimeout(()=>p.remove(), 5000);
                }, 10000);
            } else if (!ovenEl.dataset.baking) {
                showAlert("구울 고구마가 없습니다. 농장에서 수확하세요!");
            }
        }

        // 건설 및 드래그
        let placingType = null;
        let shadow = null;

        function buyBuilding(key, event) {
            if(event) event.stopPropagation();
            if(placingType) return showAlert("먼저 선택한 건물을 배치해주세요!");

            const item = items[key];
            let canBuy = true;
            for(let res in item.cost) {
                if(inventory[res] < item.cost[res]) canBuy = false;
            }

            if(canBuy) {
                for(let res in item.cost) inventory[res] -= item.cost[res];
                updateUI();
                
                placingType = key;
                shadow = document.createElement('div');
                shadow.className = `building draggable obj-${item.type} size-${item.size}`;
                shadow.dataset.key = key;
                shadow.dataset.group = item.type;
                
                if (item.img) {
                    shadow.style.background = `url('${item.img}') no-repeat center/contain`;
                    shadow.classList.add('has-img');
                } else {
                    shadow.innerHTML = `<span style="position:relative; z-index:2;">${item.emoji}</span>`;
                }
                
                if(key === 'lamp') {
                    shadow.innerHTML += '<div class="lamp-glow"></div>';
                } else if (key === 'oven') {
                    shadow.innerHTML += '<div class="oven-fire">🔥</div>';
                }
                
                shadow.style.opacity = '0.6';
                shadow.style.pointerEvents = 'none';
                
                let initX = Math.round((window.innerWidth/2 - shadow.offsetWidth/2) / 50) * 50;
                let initY = Math.round((window.innerHeight/2 - shadow.offsetHeight/2) / 50) * 50;
                shadow.style.left = initX + 'px';
                shadow.style.top = initY + 'px';
                
                document.getElementById('game-board').appendChild(shadow);
            } else {
                showAlert("자원이 부족합니다!");
            }
        }

        document.getElementById('game-board').addEventListener('mousemove', (e) => {
            if(shadow) {
                let x = Math.round((e.clientX - shadow.offsetWidth/2)/50)*50;
                let y = Math.round((e.clientY - shadow.offsetHeight/2)/50)*50;
                shadow.style.left = x + 'px';
                shadow.style.top = y + 'px';
                updateYSorting(shadow);
            }
        });

        document.getElementById('game-board').addEventListener('click', (e) => {
            if(e.target.closest('#shop') || e.target.closest('#inventory') || e.target.closest('.modal-bg') || e.target.closest('#volcano') || e.target.closest('#quest-panel')) return;

            if(placingType && shadow) {
                shadow.style.opacity = '1';
                shadow.style.pointerEvents = 'auto';
                
                let x = Math.round((e.clientX - shadow.offsetWidth/2)/50)*50;
                let y = Math.round((e.clientY - shadow.offsetHeight/2)/50)*50;
                shadow.style.left = x + 'px';
                shadow.style.top = y + 'px';
                updateYSorting(shadow);
                
                const key = placingType;
                shadow.addEventListener('mousedown', (ev) => {
                    if(key === 'oven') handleOvenClick(shadow);
                    else checkCollection(shadow);
                    dragStart(ev, shadow);
                });
                shadow.addEventListener('touchstart', (ev) => {
                    if(key === 'oven') handleOvenClick(shadow);
                    else checkCollection(shadow);
                    dragStart(ev, shadow);
                }, {passive: false});
                
                placedBuildings.push({ key: key, el: shadow, timer: 0 });

                shadow = null;
                placingType = null;
                showAlert("건설 완료!");
                updateUI(); // 퀘스트 체크
            }
        });

        let draggingEl = null, startX, startY, initX, initY;
        function dragStart(e, b) {
            draggingEl = b;
            draggingEl.style.zIndex = 30000;
            if(e.type.includes('touch')) {
                startX = e.touches[0].clientX; startY = e.touches[0].clientY;
            } else {
                startX = e.clientX; startY = e.clientY;
            }
            initX = parseInt(b.style.left||0); initY = parseInt(b.style.top||0);
            e.stopPropagation();
        }
        
        window.addEventListener('mousemove', (e) => {
            if(!draggingEl) return;
            let dx = e.clientX - startX; let dy = e.clientY - startY;
            draggingEl.style.left = (Math.round((initX + dx)/50)*50) + 'px';
            draggingEl.style.top = (Math.round((initY + dy)/50)*50) + 'px';
        });
        window.addEventListener('mouseup', () => {
            if(draggingEl) { updateYSorting(draggingEl); draggingEl = null; }
        });
        
        window.addEventListener('touchmove', (e) => {
            if(!draggingEl) return;
            let dx = e.touches[0].clientX - startX; let dy = e.touches[0].clientY - startY;
            draggingEl.style.left = (Math.round((initX + dx)/50)*50) + 'px';
            draggingEl.style.top = (Math.round((initY + dy)/50)*50) + 'px';
        }, {passive:false});
        window.addEventListener('touchend', () => {
            if(draggingEl) { updateYSorting(draggingEl); draggingEl = null; }
        });

        // 화산 폭발 로직
        function createParticle(type, startX, startY) {
            const board = document.getElementById('game-board');
            const p = document.createElement('div');
            p.className = 'particle';
            p.dataset.res = type;
            p.style.background = `url('${type}_processed.webp') no-repeat center/contain`;
            p.style.left = startX + 'px'; p.style.top = startY + 'px';
            board.appendChild(p);
            
            // 발전소 자동 수집 체크
            const powers = placedBuildings.filter(b => b.key === 'power');
            if(powers.length > 0 && Math.random() > 0.4) {
                const target = powers[0].el;
                const tx = parseInt(target.style.left) + 75;
                const ty = parseInt(target.style.top) + 75;
                setTimeout(() => {
                    p.style.left = tx + 'px'; p.style.top = ty + 'px';
                    p.style.transform = 'scale(0.2)';
                    setTimeout(() => {
                        inventory[type]++; updateUI(); p.remove();
                    }, 1000);
                }, 50);
                return;
            }

            setTimeout(() => {
                const angle = Math.random() * Math.PI * 2;
                const dist = 100 + Math.random() * 400; 
                p.style.left = (startX + Math.cos(angle)*dist) + 'px';
                p.style.top = (startY + Math.sin(angle)*dist) + 'px';
            }, 50);

            p.addEventListener('mouseover', () => { if(isSweeping) checkCollection(p); });
            p.addEventListener('mousedown', () => checkCollection(p));
            p.addEventListener('touchstart', (e) => { e.preventDefault(); checkCollection(p); }, {passive: false});
            setTimeout(() => { if(p.parentNode) p.remove(); }, 15000);
        }

        function erupt(amountMultiplier = 1) {
            const vol = document.getElementById('volcano');
            vol.classList.add('shake');
            setTimeout(() => vol.classList.remove('shake'), 500);
            const rect = vol.getBoundingClientRect();
            const startX = rect.left + rect.width/2 - 30;
            const startY = rect.top + rect.height/2;

            const amount = 3 * amountMultiplier + Math.floor(Math.random() * 3 * amountMultiplier);
            for(let i=0; i<amount; i++) {
                createParticle(resTypes[Math.floor(Math.random() * resTypes.length)], startX, startY);
            }
        }

        document.getElementById('volcano').addEventListener('click', () => {
            if(shadow) return; 
            const modal = document.getElementById('quiz-modal');
            const qObj = questions[Math.floor(Math.random() * questions.length)];
            currentQuiz = qObj;
            document.getElementById('quiz-q').innerText = qObj.q;
            const optsDiv = document.getElementById('quiz-options');
            optsDiv.innerHTML = '';
            
            qObj.opts.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option'; btn.innerText = opt;
                btn.onclick = () => {
                    if(idx === currentQuiz.a) {
                        showAlert("정답! 대폭발!");
                        quizzesAnswered++; updateUI();
                        erupt(6); 
                    } else showAlert("앗! 틀렸어요.");
                    modal.style.display = 'none';
                };
                optsDiv.appendChild(btn);
            });
            modal.style.display = 'flex';
        });

        // 1초마다 실행되는 타이쿤 메인 루프 (낮밤, 농장, 관광객)
        setInterval(() => {
            dayTick++;
            const wasNight = isNight;
            isNight = (dayTick % 180) >= 120; // 120초 낮, 60초 밤
            
            if(isNight && !wasNight) {
                document.getElementById('night-overlay').style.opacity = '1';
                document.body.classList.add('night-mode');
                showAlert("🌙 밤이 되었습니다. 가로등이 없으면 관광객이 떠납니다!");
                updateUI(); // 퀘스트 6번 체크
            } else if (!isNight && wasNight) {
                document.getElementById('night-overlay').style.opacity = '0';
                document.body.classList.remove('night-mode');
                showAlert("☀️ 아침이 밝았습니다!");
            }

            // 오토마톤
            placedBuildings.forEach(b => {
                b.timer++;
                
                // 농장 수확 (30초마다)
                if(b.key === 'farm' && b.timer >= 30) {
                    b.timer = 0;
                    const p = document.createElement('div');
                    p.className = 'crop'; p.innerText = '🍠';
                    p.style.left = (parseInt(b.el.style.left) + 50 + Math.random()*50) + 'px';
                    p.style.top = (parseInt(b.el.style.top) + Math.random()*50) + 'px';
                    p.addEventListener('mousedown', () => checkCollection(p));
                    p.addEventListener('mouseover', () => { if(isSweeping) checkCollection(p); });
                    document.getElementById('game-board').appendChild(p);
                }
                
                // 온천 관광객 (시너지 계산)
                if(b.key === 'hot') {
                    // 주변 조각상 개수 (반경 300px 이내)
                    const bx = parseInt(b.el.style.left); const by = parseInt(b.el.style.top);
                    const sculptures = placedBuildings.filter(ob => ['harubang','bomb','pillar'].includes(ob.key)).filter(ob => {
                        const ox = parseInt(ob.el.style.left); const oy = parseInt(ob.el.style.top);
                        return Math.abs(ox-bx) < 300 && Math.abs(oy-by) < 300;
                    }).length;
                    
                    const spawnRate = Math.max(5, 20 - (sculptures * 5)); // 최소 5초
                    if(b.timer >= spawnRate) {
                        b.timer = 0;
                        if(isNight && countB('lamp') === 0) return; // 밤인데 가로등 없으면 안옴
                        
                        const t = document.createElement('div');
                        t.className = 'tourist'; t.innerText = '👦';
                        t.style.left = (bx - 50 + Math.random()*200) + 'px';
                        t.style.top = (by + Math.random()*100) + 'px';
                        t.addEventListener('mousedown', () => checkCollection(t));
                        t.addEventListener('mouseover', () => { if(isSweeping) checkCollection(t); });
                        document.getElementById('game-board').appendChild(t);
                        setTimeout(() => { if(t.parentNode) t.remove(); }, 10000); // 10초뒤 사라짐
                    }
                }
            });
            
            // 밤인데 가로등 없으면 모든 관광객 증발
            if(isNight && countB('lamp') === 0) {
                document.querySelectorAll('.tourist').forEach(el => el.remove());
            }

            // 10초마다 자동 분출
            if(dayTick % 10 === 0) erupt(1);

        }, 1000);

        // 초기화
        renderShop();
        updateUI();

    </script>
</body>
</html>
