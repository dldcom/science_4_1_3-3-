<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>볼케이노 타이쿤: 퀘스트 마스터</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #D49A6A; 
            font-family: 'Comic Sans MS', 'Jua', sans-serif; 
            user-select: none; 
            touch-action: none; 
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            box-sizing: border-box;
            width: 100vw;
            height: 100dvh;
        }
        
        #viewport { position: relative; width: 100%; height: 100%; overflow: hidden; }
        
        #game-board { position: absolute; width: 3000px; height: 3000px; transform-origin: 0 0; background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px), url('stardew_bg.png'); background-size: 30px 30px, 30px 30px, 400px 400px; overflow: hidden; }
        
        #volcano { position: absolute; left: 1500px; top: 1500px; transform: translate(-50%, -50%); width: 150px; height: 150px; background: url('volcano_processed.webp') no-repeat center/contain; cursor: pointer; z-index: 10; transition: transform 0.1s; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3)); }
        #volcano:active { transform: translate(-50%, -50%) scale(0.95); }
        #volcano.cooldown { filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3)) grayscale(100%); cursor: not-allowed; opacity: 0.85; }
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0% { transform: translate(-50%, -50%) rotate(0deg); } 25% { transform: translate(-55%, -45%) rotate(-5deg); } 50% { transform: translate(-45%, -55%) rotate(5deg); } 75% { transform: translate(-55%, -55%) rotate(-5deg); } 100% { transform: translate(-50%, -50%) rotate(0deg); } }

        .particle { position: absolute; width: 70px; height: 70px; cursor: pointer; z-index: 19000; transition: top 1s cubic-bezier(0.25, 1, 0.5, 1), left 1s cubic-bezier(0.25, 1, 0.5, 1); filter: drop-shadow(0 5px 5px rgba(0,0,0,0.4)); }
        .particle:active { transform: scale(0.9); }
        
        .crop, .tourist { position: absolute; font-size: 40px; cursor: pointer; z-index: 19000; animation: bounceIn 0.5s; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.4)); }
        @keyframes bounceIn { 0% { transform: scale(0); } 80% { transform: scale(1.2); } 100% { transform: scale(1); } }
        
        .emotion { position: absolute; font-size: 16px; animation: floatUp 2s forwards; z-index: 19500; pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(0.5); } 20% { transform: translateY(-10px) scale(1.2); } 100% { opacity: 0; transform: translateY(-40px) scale(1); } }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20000; }
        
        #inventory { position: absolute; top: 15px; left: 15px; pointer-events: auto; background: rgba(255,255,255,0.95); padding: 8px 15px; border-radius: 20px; display: flex; flex-wrap: nowrap; gap: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: 2px solid #ddd; }
        .inv-item { display: flex; align-items: center; font-size: 16px; font-weight: bold; background: #eee; padding: 4px 10px; border-radius: 10px; }
        .inv-item img, .inv-item span.icon { width: 25px; height: 25px; margin-right: 5px; font-size: 20px; line-height: 25px; display: inline-block; text-align: center; }
        
        #shop-toggle-btn { position: absolute; top: 15px; right: 15px; pointer-events: auto; background: #FF9800; color: white; padding: 10px 20px; border-radius: 10px; font-weight: bold; font-size: 18px; border: 3px solid #E65100; box-shadow: 0 4px 0 #E65100; cursor: pointer; z-index: 20001; }
        #shop-toggle-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #E65100; }
        #shop { position: absolute; top: 60px; right: 15px; pointer-events: auto; background: rgba(255,255,255,0.95); padding: 15px; border-radius: 15px; width: 350px; height: 60vh; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: 2px solid #ddd; display: none; }
        #quest-toggle-btn { position: absolute; top: 15px; right: 175px; pointer-events: auto; background: #E6C229; color: white; padding: 10px 20px; border-radius: 10px; font-weight: bold; font-size: 18px; border: 3px solid #C4A000; box-shadow: 0 4px 0 #C4A000; cursor: pointer; z-index: 20001; }
        #quest-toggle-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #C4A000; }
        #quest-panel { position: absolute; top: 60px; right: 175px; pointer-events: auto; background: rgba(255,250,200,0.95); padding: 15px; border-radius: 15px; width: 280px; height: 35vh; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: 2px solid #E6C229; display: none; }
        
        .panel-title { text-align: center; font-weight: bold; font-size: 20px; margin-bottom: 12px; color: #333; border-bottom: 2px solid #ccc; padding-bottom: 8px; }
        
        .shop-item { display: flex; align-items: center; background: #fff; border: 2px solid #ddd; border-radius: 10px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
        .shop-item:active { transform: scale(0.98); }
        .shop-item .icon-box { width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; font-size: 40px; background: #f5f5f5; border-radius: 10px; margin-right: 12px; }
        .shop-item .icon-box img { max-width: 100%; max-height: 100%; }
        .shop-item .info { flex: 1; }
        .shop-item .name { font-weight: bold; font-size: 18px; color: #333; margin-bottom: 4px; }
        .shop-item .desc { font-size: 13px; color: #007BFF; margin-bottom: 6px; word-break: keep-all; line-height: 1.3; }
        .shop-item .cost { font-size: 14px; color: #666; font-weight: bold; display: flex; flex-wrap: wrap; gap: 6px; }
        .shop-item .cost span { display: flex; align-items: center; }
        .shop-item .cost img { width: 16px; height: 16px; margin-right: 4px; }

        .quest-item { background: #fff; border: 2px dashed #E6C229; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; font-weight: bold; }
        .quest-item.done { background: #d4edda; border-style: solid; border-color: #28a745; color: #155724; text-decoration: line-through; }
        .quest-title { color: #E6C229; margin-bottom: 3px; font-size: 14px; }
        .quest-item.done .quest-title { color: #28a745; }

        /* 공통 모달 배경 스타일 */
        .modal-bg {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 30000;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            box-sizing: border-box;
        }

        /* 공통 모달 콘텐츠 스타일 */
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            border: 6px solid #000;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.8);
            text-align: center;
            max-width: 90%;
            width: 400px;
            box-sizing: border-box;
            animation: bounceInModal 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        @keyframes bounceInModal {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 공통 닫기 버튼 스타일 */
        .close-btn {
            background: #FF5722;
            color: white;
            border: 4px solid #000;
            border-radius: 12px;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 4px 4px 0 #000;
            margin-top: 15px;
            transition: all 0.1s;
        }
        .close-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #000;
        }

        /* 1. 퀴즈 문제 창 UI 개선 (더 감각적이고 두꺼운 테두리 및 그림자) */
        #quiz-modal .modal-content {
            border: 8px solid #FF5722;
            box-shadow: 12px 12px 0px rgba(0, 0, 0, 0.9);
            border-radius: 24px;
            padding: 40px;
            background: #FFF9F6;
            width: 580px; /* 퀴즈창 가로로 더 키움 */
            max-width: 95%;
        }

        /* 퀘스트 도착 모달 스타일 */
        #quest-alert-modal .modal-content {
            border: 8px solid #E6C229;
            box-shadow: 12px 12px 0px rgba(0, 0, 0, 0.9);
            border-radius: 24px;
            padding: 40px;
            background: #FFFAEE;
            width: 540px;
            max-width: 95%;
        }

        /* 퀘스트 완료 모달 스타일 */
        #quest-complete-modal .modal-content {
            border: 8px solid #28a745;
            box-shadow: 12px 12px 0px rgba(0, 0, 0, 0.9);
            border-radius: 24px;
            padding: 40px;
            background: #F0FDF4;
            width: 540px;
            max-width: 95%;
        }

        /* 2. 문제 글씨 크기 키우기 */
        #quiz-q {
            font-size: 30px;
            font-weight: 900;
            line-height: 1.4;
            color: #E64A19 !important;
            margin-bottom: 25px;
            word-break: keep-all;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
        }

        /* 2. 선택지 버튼 크기 줄이기 및 감각적인 스타일 */
        #quiz-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quiz-option {
            background: #FFF;
            border: 4px solid #000;
            border-radius: 14px;
            padding: 10px 16px; /* 버튼 크기 줄임 */
            font-size: 16px;     /* 버튼 글씨 크기 줄임 */
            font-weight: 800;
            color: #333;
            cursor: pointer;
            box-shadow: 4px 4px 0 #000;
            transition: all 0.1s;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            display: block;
            margin: 0;
        }

        .quiz-option:hover {
            background: #E3F2FD;
            border-color: #2196F3;
            color: #0D47A1;
        }

        .quiz-option:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #000;
        }

        
        /* 건물/강아지 관련 스타일 */
        #building-modal .modal-content {
            border: 8px solid #FF5722;
            box-shadow: 12px 12px 0px rgba(0, 0, 0, 0.9);
            border-radius: 24px;
            padding: 40px;
            background: #FFF;
            width: 540px;
            max-width: 90%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .building-action-btn { 
            padding: 16px; 
            background: #4CAF50; 
            color: white; 
            border: 4px solid #000; 
            border-radius: 14px; 
            font-size: 20px; 
            font-weight: 900; 
            cursor: pointer; 
            transition: all 0.1s; 
            display: block; 
            width: 100%; 
            box-sizing: border-box; 
            margin-bottom: 8px;
            box-shadow: 4px 4px 0 #000;
        }
        .building-action-btn:active { 
            transform: translate(2px, 2px); 
            box-shadow: 2px 2px 0 #000;
        }
        .building-action-btn.move-btn { background: #2196F3; }
        .building-action-btn.demo-btn { background: #f44336; }
        .building-action-btn:disabled { 
            background: #ccc; 
            cursor: not-allowed; 
            box-shadow: none; 
            transform: none; 
            border-color: #777;
        }
        .top-right-btn {
            width: 54px;
            height: 40px;
            border: 3px solid #000;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            box-shadow: 3px 3px 0 #000;
        }
        .top-right-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0 #000;
        }
        .top-right-btn.move-btn { background: #2196F3; }
        .top-right-btn.demo-btn { background: #f44336; }

        
        .puppy { position: absolute; font-size: 40px; z-index: 19000; animation: bounceIn 0.5s; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.4)); transition: left 0.5s linear, top 0.5s linear; pointer-events: none; }
        .puppy.knight { font-size: 45px; filter: drop-shadow(0 5px 10px rgba(255,215,0,0.5)); }
        .golden-puppy { position: absolute; font-size: 60px; filter: drop-shadow(0 0 20px rgba(255,215,0,1)); animation: glow 1s infinite alternate; transition: left 1s linear, top 1s linear; z-index: 19000; pointer-events: none; }
        @keyframes glow { from { filter: drop-shadow(0 0 10px rgba(255,215,0,0.8)); } to { filter: drop-shadow(0 0 25px rgba(255,215,0,1)); } }

        
        /* 스프라이트 애니메이션 CSS */
        .tourist-sprite, .tourist-woman-sprite, .explorer-m-sprite, .explorer-f-sprite, .photographer-sprite, .puppy-sprite, .golden-puppy-sprite {
            position: absolute;
            width: 32px; height: 32px;
            background-size: 128px 128px;
            z-index: 19000;
            transition: left 0.5s linear, top 0.5s linear;
            pointer-events: none;
            background-repeat: no-repeat;
        }
        .tourist-sprite { background-image: url('tourist_sprite.png'); }
        .tourist-woman-sprite { background-image: url('tourist_woman_sprite.png'); }
        .explorer-m-sprite { background-image: url('explorer_m_sprite.png'); }
        .explorer-f-sprite { background-image: url('explorer_f_sprite.png'); }
        .photographer-sprite { background-image: url('photographer_sprite.png'); }
        .puppy-sprite { background-image: url('puppy_sprite.png'); filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); }
        .golden-puppy-sprite { 
            background-image: url('puppy_sprite.png');
            filter: drop-shadow(0 0 10px rgba(255,215,0,0.8)) sepia(1) saturate(5) hue-rotate(-20deg);
            width: 48px; height: 48px;
            background-size: 192px 192px;
        }
        .puppy-knight { filter: drop-shadow(0 0 5px rgba(200,200,255,0.8)); }
        
        @keyframes walk-normal { from { background-position-x: 0px; } to { background-position-x: -128px; } }
        @keyframes walk-golden { from { background-position-x: 0px; } to { background-position-x: -192px; } }

        .walk-down { background-position-y: 0px; }
        .walk-up { background-position-y: -32px; }
        .walk-right { background-position-y: -64px; }
        .walk-left { background-position-y: -96px; }

        .tourist-sprite.walk-down, .tourist-sprite.walk-up, .tourist-sprite.walk-right, .tourist-sprite.walk-left,
        .tourist-woman-sprite.walk-down, .tourist-woman-sprite.walk-up, .tourist-woman-sprite.walk-right, .tourist-woman-sprite.walk-left,
        .explorer-m-sprite.walk-down, .explorer-m-sprite.walk-up, .explorer-m-sprite.walk-right, .explorer-m-sprite.walk-left,
        .explorer-f-sprite.walk-down, .explorer-f-sprite.walk-up, .explorer-f-sprite.walk-right, .explorer-f-sprite.walk-left,
        .photographer-sprite.walk-down, .photographer-sprite.walk-up, .photographer-sprite.walk-right, .photographer-sprite.walk-left,
        .puppy-sprite.walk-down, .puppy-sprite.walk-up, .puppy-sprite.walk-right, .puppy-sprite.walk-left {
            animation: walk-normal 0.6s steps(4) infinite;
        }

        .golden-puppy-sprite.walk-down { background-position-y: 0px; }
        .golden-puppy-sprite.walk-up { background-position-y: -48px; }
        .golden-puppy-sprite.walk-right { background-position-y: -96px; }
        .golden-puppy-sprite.walk-left { background-position-y: -144px; }
        .golden-puppy-sprite.walk-down, .golden-puppy-sprite.walk-up, .golden-puppy-sprite.walk-right, .golden-puppy-sprite.walk-left {
            animation: walk-golden 0.6s steps(4) infinite;
        }
        .idle { animation: none !important; background-position-x: 0px !important; }

        /* 건축물 기본 속성 */
        .building { position: absolute; user-select: none; touch-action: none; display: flex; justify-content: center; align-items: center; }
        .building.draggable { cursor: grab; }
        .building.draggable:active { cursor: grabbing; filter: brightness(1.1); }
        
        .size-1 { width: 30px; height: 30px; font-size: 20px; }
        .size-2 { width: 60px; height: 60px; font-size: 40px; }
        .size-3 { width: 90px; height: 90px; font-size: 50px; }

        .obj-3d { filter: drop-shadow(0 15px 10px rgba(0,0,0,0.3)); background: rgba(255,255,255,0.5); border: 2px dashed #aaa; border-radius: 10px; }
        .obj-3d.has-img { background: transparent; border: none; }
        .obj-tile { z-index: 5 !important; border: 1px dashed rgba(255,255,255,0.3); }
        
        /* 특수 기능 효과 */
        .oven-fire { position: absolute; bottom: 0; font-size: 40px; animation: flicker 0.5s infinite alternate; pointer-events: none; display: none; }
        @keyframes flicker { 0% { opacity: 0.8; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1.1); } }
        @keyframes floatAndBounce {
            0% { transform: translate(-50%, 0) scale(0.95); }
            100% { transform: translate(-50%, -8px) scale(1.05); }
        }
        @keyframes craterGoldFloat {
            0% { transform: translate(-50%, -50%) scale(0.85); filter: drop-shadow(0 0 10px rgba(255,215,0,0.8)); }
            100% { transform: translate(-50%, -75%) scale(1.25); filter: drop-shadow(0 0 30px rgba(255,215,0,1)) drop-shadow(0 0 8px #fff); }
        }

        #alert-text { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); font-size: 28px; font-weight: bold; color: white; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; z-index: 40000; opacity: 0; pointer-events: none; transition: opacity 0.4s; text-align: center; line-height: 1.4; background: rgba(0, 0, 0, 0.85); padding: 15px 30px; border-radius: 20px; border: 4px solid #fff; box-shadow: 6px 6px 0px rgba(0,0,0,0.8); }
        #alert-text.success { background: rgba(46, 125, 50, 0.95) !important; border-color: #A5D6A7 !important; }
        #alert-text.error { background: rgba(198, 40, 40, 0.95) !important; border-color: #EF9A9A !important; }
        #alert-text.info { background: rgba(0, 0, 0, 0.85) !important; border-color: #fff !important; }
        
        /* 훈장 표시기 */
        #medals-container { position: absolute; top: 130px; left: 15px; display: flex; gap: 5px; font-size: 30px; pointer-events: none; z-index: 20000;}
        
        #zoom-controls { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 30000; pointer-events: auto; }
        .zoom-btn { background: rgba(255,255,255,0.95); border: 2px solid #555; border-radius: 12px; width: 55px; height: 55px; font-size: 26px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.1s; display: flex; justify-content: center; align-items: center; }
        .zoom-btn:active { transform: scale(0.9); }

        @media (max-width: 900px) {
            #inventory {
                top: 10px; left: 10px; right: 10px;
                flex-wrap: wrap; justify-content: flex-start;
                padding: 5px; gap: 5px;
            }
            .inv-item { font-size: 14px; padding: 2px 6px; }
            .inv-item img, .inv-item span.icon { width: 20px; height: 20px; font-size: 16px; margin-right: 2px; }
            
            #shop-toggle-btn { top: auto; bottom: 15px; right: 15px; z-index: 20002; font-size: 15px; padding: 8px 12px; }
            #shop { top: 10vh; right: 15px; width: calc(100vw - 30px); max-width: 320px; height: 75vh; }
            
            #quest-toggle-btn { top: auto; bottom: 15px; right: 130px; z-index: 20002; font-size: 15px; padding: 8px 12px; }
            #quest-panel { top: 10vh; right: 15px; width: calc(100vw - 30px); max-width: 320px; height: 50vh; }
            
            #zoom-controls { bottom: 70px; right: 15px; }
            #medals-container { top: auto; bottom: 15px; left: 15px; }
        }
    </style>
</head>
<body>
    <div id="viewport">
        <div id="game-board">
            <div id="volcano" class="obj-3d has-img"></div>
        </div>
        
        <div id="alert-text"></div>
        
        <div id="ui-layer">
            <div id="inventory">
                <div class="inv-item" onclick="showResInfo('gas', '화산 가스', '화산 분출물 중 기체 상태입니다. 대부분 수증기이고 이산화 탄소 등도 포함됩니다.')" style="cursor:help;" title="클릭하여 정보 보기"><img src="gas_processed.webp">화산 가스: <span id="inv-gas">0</span></div>
                <div class="inv-item" onclick="showResInfo('lava', '용암', '화산 분출물 중 액체 상태입니다. 마그마가 지표로 흘러나온 것으로, 식으면 암석이 됩니다.')" style="cursor:help;" title="클릭하여 정보 보기"><img src="lava_processed.webp">용암: <span id="inv-lava">0</span></div>

    <script>
        const inventory = { gas: 0, lava: 0, ash: 0, rock: 0, potato: 0, roasted: 0, golden_potato: 0, tourists: 0 };
        const resTypes = ['gas', 'lava', 'ash', 'rock'];
        
        let placedBuildings = [];
        let quizzesAnswered = 0;
        let currentQuiz = null;
        let dayTick = 0; 
        
        // Panning logic
        let boardX = (window.innerWidth / 2) - 1500;
        let boardY = (window.innerHeight / 2) - 1500;
        let zoomLevel = 1.0;
        const board = document.getElementById('game-board');
        
        function updateTransform() {
            board.style.transform = `translate(${boardX}px, ${boardY}px) scale(${zoomLevel})`;
        }
        updateTransform();
        
        function changeZoom(delta) {
            let oldZoom = zoomLevel;
            zoomLevel += delta;
            if(zoomLevel < 0.4) zoomLevel = 0.4;
            if(zoomLevel > 2.0) zoomLevel = 2.0;
            
            let cx = window.innerWidth / 2;
            let cy = window.innerHeight / 2;
            boardX = cx - (cx - boardX) * (zoomLevel / oldZoom);
            boardY = cy - (cy - boardY) * (zoomLevel / oldZoom);
            updateTransform();
        }
        
        let isPanning = false;
        let panStartX = 0, panStartY = 0;
        let initialPinchDistance = null;
        let initialZoomLevel = 1.0;

        document.getElementById('viewport').addEventListener('mousedown', (e) => {
            if(e.target === board || e.target.closest('#volcano')) {
                isPanning = true;
                panStartX = e.clientX - boardX;
                panStartY = e.clientY - boardY;
                board.style.cursor = 'grabbing';
            }
        });
        document.addEventListener('mousemove', (e) => {
            if(isPanning) {
                boardX = e.clientX - panStartX;
                boardY = e.clientY - panStartY;
                updateTransform();
            }
        });
        document.addEventListener('mouseup', () => {
            if(isPanning) {
                isPanning = false;
                board.style.cursor = '';
            }
        });

        // Wheel zoom logic
        document.getElementById('viewport').addEventListener('wheel', (e) => {
            if (e.target.closest('#shop') || e.target.closest('#quest-panel') || e.target.closest('.modal-content')) return;
            let oldZoom = zoomLevel;
            let zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
            zoomLevel *= zoomFactor;
            
            if(zoomLevel < 0.4) zoomLevel = 0.4;
            if(zoomLevel > 2.0) zoomLevel = 2.0;
            
            let cx = e.clientX;
            let cy = e.clientY;
            
            boardX = cx - (cx - boardX) * (zoomLevel / oldZoom);
            boardY = cy - (cy - boardY) * (zoomLevel / oldZoom);
            updateTransform();
        }, {passive: true});
        
        function getDistance(touch1, touch2) {
            let dx = touch1.clientX - touch2.clientX;
            let dy = touch1.clientY - touch2.clientY;
            return Math.sqrt(dx*dx + dy*dy);
        }

        document.getElementById('viewport').addEventListener('touchstart', (e) => {
            if(e.touches.length === 1 && (e.target === board || e.target.closest('#volcano'))) {
                isPanning = true;
                panStartX = e.touches[0].clientX - boardX;
                panStartY = e.touches[0].clientY - boardY;
            } else if(e.touches.length === 2) {
                isPanning = false;
                initialPinchDistance = getDistance(e.touches[0], e.touches[1]);
                initialZoomLevel = zoomLevel;
            }
        }, {passive: false});
        
        document.addEventListener('touchmove', (e) => {
            if(isPanning && e.touches.length === 1) {
                e.preventDefault(); 
                boardX = e.touches[0].clientX - panStartX;
                boardY = e.touches[0].clientY - panStartY;
                updateTransform();
            } else if(e.touches.length === 2 && initialPinchDistance) {
                e.preventDefault();
                let currentDistance = getDistance(e.touches[0], e.touches[1]);
                let scale = currentDistance / initialPinchDistance;
                
                let oldZoom = zoomLevel;
                zoomLevel = initialZoomLevel * scale;
                if(zoomLevel < 0.4) zoomLevel = 0.4;
                if(zoomLevel > 2.0) zoomLevel = 2.0;
                
                let cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                let cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                
                boardX = cx - (cx - boardX) * (zoomLevel / oldZoom);
                boardY = cy - (cy - boardY) * (zoomLevel / oldZoom);
                updateTransform();
            }
        }, {passive: false});
        
        document.addEventListener('touchend', (e) => { 
            if(e.touches.length < 2) {
                initialPinchDistance = null;
            }
            if(e.touches.length === 0) {
                isPanning = false; 
            } else if (e.touches.length === 1 && !isPanning) {
                isPanning = true;
                panStartX = e.touches[0].clientX - boardX;
                panStartY = e.touches[0].clientY - boardY;
            }
        });

        };

        function countB(type) { return placedBuildings.filter(b => b.key === type).length; }

        function updateUI() {
            Object.keys(inventory).forEach(k => {
                const el = document.getElementById(`inv-${k}`);
                if(el) el.innerText = inventory[k];
            });
            renderQuests();
        }

        function showAlert(msg, type = 'info') {
            const al = document.getElementById('alert-text');
            al.innerHTML = msg;
            
            // 기존 테마 클래스 초기화
            al.classList.remove('success', 'error', 'info');
            al.classList.add(type);
            
            al.style.opacity = 1;
            setTimeout(() => { al.style.opacity = 0; }, 2500);
        }

        function renderShop() {
            const container = document.getElementById('shop-items');
            container.innerHTML = '';
            for (let key in items) {
                const it = items[key];
                let costHtml = '';
                for (let c in it.cost) costHtml += `<span><img src="${c}_processed.webp">${it.cost[c]}</span>`;
                let iconHtml = it.img ? `<img src="${it.img}">` : it.emoji;
                
                container.innerHTML += `
                    <div class="shop-item" onclick="buyBuilding('${key}', event)">
                        <div class="icon-box">${iconHtml}</div>
                        <div class="info">
                            <div class="name">${it.name}</div>
                            <div class="desc">${it.desc || ''}</div>
                            <div class="cost">${costHtml}</div>
                        </div>
                    </div>
                `;
            }
        }

        function toggleShop() {
            const shop = document.getElementById('shop');
            const btn = document.getElementById('shop-toggle-btn');
            if (shop.style.display === 'none' || shop.style.display === '') {
                shop.style.display = 'block';
                btn.innerText = '❌ 상점 닫기';
            } else {
                shop.style.display = 'none';
                btn.innerText = '🛒 상점 열기';
            }
        }
        
        function toggleQuest() {
            const panel = document.getElementById('quest-panel');
            const btn = document.getElementById('quest-toggle-btn');
            if (panel.style.display === 'none' || panel.style.display === '') {
                panel.style.display = 'block';
                btn.innerText = '❌ 퀘스트 닫기';
            } else {
                panel.style.display = 'none';
                btn.innerText = '📜 퀘스트 열기';
            }
        }
        
        function showResInfo(type, title, desc) {
            const modal = document.getElementById('res-info-modal');
            let iconHtml = type === 'gas' || type === 'lava' || type === 'ash' || type === 'rock' ? 
                           `<img src="${type}_processed.webp" style="width:50px;height:50px;">` : '❓';
            document.getElementById('res-info-icon').innerHTML = iconHtml;
            document.getElementById('res-info-title').innerText = title;
            document.getElementById('res-info-desc').innerText = desc;
            modal.style.display = 'flex';
        }

        let lastShownQuestId = null;
        let firstQuestDelayPassed = false;
        
        setTimeout(() => {
            firstQuestDelayPassed = true;
            updateUI();
        }, 15000);

        function renderQuests() {
            const container = document.getElementById('quest-items');
            container.innerHTML = '';
            
            if (!firstQuestDelayPassed) {
                container.innerHTML = '<div style="color: #888; font-size: 14px; text-align: center; padding: 10px; line-height: 1.5;">자유롭게 마을을 꾸며보세요!<br>잠시 후 첫 퀘스트가 주어집니다.</div>';
                return;
            }
            
            let activeQuest = quests.find(q => !q.done);
            
            const completeModal = document.getElementById('quest-complete-modal');
            if (completeModal && completeModal.style.display === 'flex') {
                // Do nothing if complete modal is showing
            } else {
                if (activeQuest && activeQuest.condition()) {
                    activeQuest.done = true;
                    let rewardText = `🎉 퀘스트를 완료하였습니다!`;
                    if(activeQuest.medal) {
                        rewardText += `<br>${activeQuest.medal} 훈장 획득!`;
                        // document.getElementById('medals-container').innerHTML += activeQuest.medal;
                    }
                    
                    document.getElementById('quest-complete-title').innerText = activeQuest.title;
                    document.getElementById('quest-complete-desc').innerHTML = rewardText;
                    completeModal.style.display = 'flex';
                } else if (activeQuest && activeQuest.id !== lastShownQuestId) {
                    lastShownQuestId = activeQuest.id;
                    document.getElementById('quest-alert-title').innerText = activeQuest.title;
                    document.getElementById('quest-alert-desc').innerText = activeQuest.desc;
                    document.getElementById('quest-alert-modal').style.display = 'flex';
                }
            }

            quests.forEach(q => {
                if (q.done) {
                    container.innerHTML += `
                        <div class="quest-item done">
                            <div class="quest-title">${q.title}</div>
                            ✅ 완료
                        </div>
                    `;
                } else if (q === activeQuest) {
                    container.innerHTML += `
                        <div class="quest-item">
                            <div class="quest-title">${q.title}</div>
                            🔲 ${q.desc}
                        </div>
                    `;
                }
            });
        }

        function updateYSorting(el) {
            if (el.dataset.group === 'tile') {
                el.style.zIndex = 5;
            } else {
                const rect = el.getBoundingClientRect();
                el.style.zIndex = el.offsetTop + el.offsetHeight;
            }
        }

        function isCollidingLocal(el1, el2) {
            const r1 = { left: el1.offsetLeft, top: el1.offsetTop, right: el1.offsetLeft + el1.offsetWidth, bottom: el1.offsetTop + el1.offsetHeight };
            const r2 = { left: el2.offsetLeft, top: el2.offsetTop, right: el2.offsetLeft + el2.offsetWidth, bottom: el2.offsetTop + el2.offsetHeight };
            return !(r1.right <= r2.left || r1.left >= r2.right || r1.bottom <= r2.top || r1.top >= r2.bottom);
        }

        function checkOverlap(el) {
            const vol = document.getElementById('volcano');
            if (isCollidingLocal(el, vol)) return true;
            
            for (let b of placedBuildings) {
                if (b.el === el) continue;
                if (isCollidingLocal(el, b.el)) return true;
            }
            
            for (let t of touristsList) {
                if (!t) continue;
                if (isCollidingLocal(el, t.el)) return true;
            }
            
            for (let p of puppiesList) {
                if (!p) continue;
                if (isCollidingLocal(el, p.el)) return true;
            }
            
            return false;
        }

            }, {passive: false});

        }

                if (inventory.rock >= 1) {

        function willCollide(x, y, w, h, ignoreEl) {
            const r1 = { left: x, top: y, right: x + w, bottom: y + h };
            const vol = document.getElementById('volcano');
            if (vol !== ignoreEl) {
                // Volcano visual width/height might differ, but offsetWidth is 150.
                // Note that volcano uses transform: translate(-50%, -50%) which shifts its visual bounding box!
                // Its offsetLeft is the center. So its bounding box is left - 75 to left + 75.
                const vx = vol.offsetLeft - 75;
                const vy = vol.offsetTop - 75;
                const r2 = { left: vx, top: vy, right: vx + 150, bottom: vy + 150 };
                if (!(r1.right <= r2.left || r1.left >= r2.right || r1.bottom <= r2.top || r1.top >= r2.bottom)) return true;
            }
            for (let b of placedBuildings) {
                if (b.el === ignoreEl) continue;
                // Buildings don't use translate(-50%, -50%), they are positioned from top-left.
                const r2 = { left: b.el.offsetLeft, top: b.el.offsetTop, right: b.el.offsetLeft + b.el.offsetWidth, bottom: b.el.offsetTop + b.el.offsetHeight };
                if (!(r1.right <= r2.left || r1.left >= r2.right || r1.bottom <= r2.top || r1.top >= r2.bottom)) return true;
            }
            return false;
        }

        function getSafeDestination(startX, startY, endX, endY, w, h, ignoreEl) {
            let dx = endX - startX;
            let dy = endY - startY;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist === 0) return {x: startX, y: startY, collided: false};
            
            let step = 10;
            let steps = Math.max(1, Math.floor(dist / step));
            let safeX = startX;
            let safeY = startY;
            
            for (let i = 1; i <= steps; i++) {
                let testX = startX + (dx * i / steps);
                let testY = startY + (dy * i / steps);
                if (willCollide(testX, testY, w, h, ignoreEl)) {
                    return {x: safeX, y: safeY, collided: true};
                }
                safeX = testX;
                safeY = testY;
            }
            
            if (willCollide(endX, endY, w, h, ignoreEl)) {
                return {x: safeX, y: safeY, collided: true};
            }
            return {x: endX, y: endY, collided: false};
        }

        setInterval(() => {

                let oldX = t.x, oldY = t.y;

                if (t.state === 'roaming') {
                    if (placedBuildings.length > 0 && Math.random() < 0.5) {
                        t.target = placedBuildings[Math.floor(Math.random() * placedBuildings.length)];
                        t.state = 'moving';
                    } else {
                        let rndX = (Math.random()-0.5)*300; let rndY = (Math.random()-0.5)*300;
                        t.x += rndX;
                        t.y += rndY;
                        updateSpriteDirection(t.el, rndX, rndY, true);

                            showEmotion(t.x, t.y, '📸');
                        }

                } else if (t.state === 'moving') {
                    if (t.target && t.target.el.parentNode) {
                        const tx = parseInt(t.target.el.style.left) + t.target.el.offsetWidth/2;
                        const ty = parseInt(t.target.el.style.top) + t.target.el.offsetHeight/2;
                        
                        const dx = tx - t.x;
                        const dy = ty - t.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        
                        if (dist < 80) {
                            t.state = 'enjoying';
                            t.timer = 5; 
                            t.el.style.transition = 'none';
                            updateSpriteDirection(t.el, 0, 0, false);
                        } else {
                            const speed = 100; 
                            const ratio = Math.min(1, speed / dist);
                            let moveX = dx * ratio; let moveY = dy * ratio;
                            t.x += moveX;
                            t.y += moveY;
                            updateSpriteDirection(t.el, moveX, moveY, true);
                        }
                    } else {
                        t.state = 'roaming';

                } else if (t.state === 'enjoying') {

                t.x = Math.max(0, Math.min(3000, t.x));
                t.y = Math.max(0, Math.min(3000, t.y));
                
                let targetEl = t.target ? t.target.el : null;
                if (t.state !== 'leaving') {
                    let safe = getSafeDestination(oldX, oldY, t.x, t.y, 32, 32, targetEl);
                    t.x = safe.x;
                    t.y = safe.y;
                    if (safe.collided && t.state !== 'roaming') t.state = 'roaming';
                }
                
                if (touristsList[i]) {

                            pup.state = 'roaming';
                            updateSpriteDirection(pup.el, 0, 0, false);
                        } else {
                            let mx = dx * (speed/dist); let my = dy * (speed/dist);
                            pup.x += mx; pup.y += my;
                            updateSpriteDirection(pup.el, mx, my, true);
                        }
                    } else {
                        pup.target = null;
                        pup.state = 'roaming';
                    }
                } else if (pup.state === 'leaving') {
                    pup.x -= 300; pup.y -= 300;
                    updateSpriteDirection(pup.el, -300, -300, true);
                    if(pup.x < -200 || pup.y < -200) { pup.el.remove(); puppiesList[i] = null; }
                }
                
                pup.x = Math.max(0, Math.min(3000, pup.x));
                pup.y = Math.max(0, Math.min(3000, pup.y));
                
                let targetEl = pup.targetEl || (pup.target ? pup.target.el : null);
                let pupW = pup.isGolden ? 48 : 32;
                if (pup.state !== 'leaving') {
                    let safe = getSafeDestination(oldX, oldY, pup.x, pup.y, pupW, pupW, targetEl);
                    pup.x = safe.x;
                    pup.y = safe.y;
                    if (safe.collided && pup.state !== 'roaming') pup.state = 'roaming';
                }
                
                if (puppiesList[i]) {
                    pup.el.style.left = pup.x + 'px'; 
                    pup.el.style.top = pup.y + 'px';
                }
            });
            puppiesList = puppiesList.filter(p => p !== null);
        }, 500);
 

        function restoreBuilding(key, initX, initY, upgraded) {
            const item = items[key];
            let shadow = document.createElement('div');
            shadow.className = `building obj-${item.type} size-${item.size}`;
            shadow.dataset.key = key;
            shadow.dataset.group = item.type;
            
            if (upgraded) {
                shadow.dataset.upgraded = "true";
                if (key === 'farm') {
                    shadow.style.background = `url('farm_upgraded_processed.webp') no-repeat center/contain`;
                }
            } else {
                if (item.img) {
                    shadow.style.background = `url('${item.img}') no-repeat center/contain`;
                    shadow.classList.add('has-img');
                } else {
                    shadow.innerHTML = `<span style="position:relative; z-index:2;">${item.emoji}</span>`;
                }
            }
            if (key === 'oven') shadow.innerHTML += '<div class="oven-fire">🔥</div>';
            
            shadow.style.left = initX + 'px';
            shadow.style.top = initY + 'px';
            board.appendChild(shadow);
            updateYSorting(shadow);
            
            shadow.addEventListener('click', (ev) => {
                if(isPanning) return;
                openBuildingModal(shadow, key);
            });
            
            placedBuildings.push({ key: key, el: shadow, timer: 0, upgraded: !!upgraded });
        }

        function saveGame() {
            const state = {
                inventory: inventory,
                quizzesAnswered: quizzesAnswered,
                questsDone: quests.map(q => q.done),
                firstQuestDelayPassed: firstQuestDelayPassed,
                buildings: placedBuildings.map(b => ({
                    key: b.key,
                    x: parseFloat(b.el.style.left),
                    y: parseFloat(b.el.style.top),
                    upgraded: !!b.upgraded
                }))
            };
            localStorage.setItem('volcanoTycoonSave', JSON.stringify(state));
        }

        function loadGame() {
            const savedStr = localStorage.getItem('volcanoTycoonSave');
            if (savedStr) {
                try {
                    const state = JSON.parse(savedStr);
                    Object.assign(inventory, state.inventory);
                    quizzesAnswered = state.quizzesAnswered || 0;
                    if (state.questsDone) {
                        for(let i=0; i<Math.min(quests.length, state.questsDone.length); i++) {
                            quests[i].done = state.questsDone[i];
                        }
                    }
                    if (state.firstQuestDelayPassed !== undefined) {
                        firstQuestDelayPassed = state.firstQuestDelayPassed;
                    }
                    if (state.buildings) {
                        state.buildings.forEach(b => {
                            restoreBuilding(b.key, b.x, b.y, b.upgraded);
                        });
                    }
                } catch(e) {}
            }
        }

        function resetGame() {
            if (confirm("정말로 모든 데이터를 삭제하고 처음부터 다시 시작하시겠습니까?")) {
                localStorage.removeItem('volcanoTycoonSave');
                location.reload();
            }
        }

        loadGame();
        setInterval(saveGame, 5000);

        renderShop();
        updateUI();
        function closeQuestComplete() {
            document.getElementById('quest-complete-modal').style.display = 'none';
            updateUI();
        }

    </script>
</body>
</html>
