<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>볼케이노 타이쿤: 퀘스트 마스터</title>
    <style>
        * { cursor: url('glove_point_white_processed.png') 32 32, auto !important; }
        *:active { cursor: url('glove_press_white_processed.png') 32 32, auto !important; }
        
        body { margin: 0; overflow: hidden; background-color: #79C265; font-family: 'Comic Sans MS', 'Jua', sans-serif; user-select: none; touch-action: none; }
        
        #viewport { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        
        #game-board { position: absolute; width: 3000px; height: 3000px; transform-origin: 0 0; background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 30px 30px; overflow: hidden; }
        
        #volcano { position: absolute; left: 1500px; top: 1500px; transform: translate(-50%, -50%); width: 150px; height: 150px; background: url('volcano_processed.webp') no-repeat center/contain; cursor: pointer; z-index: 10; transition: transform 0.1s; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3)); }
        #volcano:active { transform: translate(-50%, -50%) scale(0.95); }
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0% { transform: translate(-50%, -50%) rotate(0deg); } 25% { transform: translate(-55%, -45%) rotate(-5deg); } 50% { transform: translate(-45%, -55%) rotate(5deg); } 75% { transform: translate(-55%, -55%) rotate(-5deg); } 100% { transform: translate(-50%, -50%) rotate(0deg); } }

        .particle { position: absolute; width: 70px; height: 70px; cursor: pointer; z-index: 19000; transition: top 1s cubic-bezier(0.25, 1, 0.5, 1), left 1s cubic-bezier(0.25, 1, 0.5, 1); filter: drop-shadow(0 5px 5px rgba(0,0,0,0.4)); }
        .particle:active { transform: scale(0.9); }
        
        .crop, .tourist { position: absolute; font-size: 40px; cursor: pointer; z-index: 19000; animation: bounceIn 0.5s; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.4)); }
        @keyframes bounceIn { 0% { transform: scale(0); } 80% { transform: scale(1.2); } 100% { transform: scale(1); } }
        
        .emotion { position: absolute; font-size: 28px; animation: floatUp 2s forwards; z-index: 19500; pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3)); }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(0.5); } 20% { transform: translateY(-10px) scale(1.2); } 100% { opacity: 0; transform: translateY(-40px) scale(1); } }

        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20000; }
        
        #inventory { position: absolute; top: 15px; left: 15px; pointer-events: auto; background: rgba(255,255,255,0.95); padding: 8px 15px; border-radius: 20px; display: flex; flex-wrap: wrap; gap: 10px; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: 2px solid #ddd; }
        .inv-item { display: flex; align-items: center; font-size: 16px; font-weight: bold; background: #eee; padding: 4px 10px; border-radius: 10px; }
        .inv-item img, .inv-item span.icon { width: 25px; height: 25px; margin-right: 5px; font-size: 20px; line-height: 25px; display: inline-block; text-align: center; }
        
        #shop-toggle-btn { position: absolute; top: 15px; right: 15px; pointer-events: auto; background: #FF9800; color: white; padding: 10px 20px; border-radius: 10px; font-weight: bold; font-size: 18px; border: 3px solid #E65100; box-shadow: 0 4px 0 #E65100; cursor: pointer; z-index: 20001; }
        #shop-toggle-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #E65100; }
        #shop { position: absolute; top: 60px; right: 15px; pointer-events: auto; background: rgba(255,255,255,0.95); padding: 15px; border-radius: 15px; width: 350px; height: 60vh; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: 2px solid #ddd; display: none; }
        #quest-toggle-btn { position: absolute; top: 15px; right: 150px; pointer-events: auto; background: #E6C229; color: white; padding: 10px 20px; border-radius: 10px; font-weight: bold; font-size: 18px; border: 3px solid #C4A000; box-shadow: 0 4px 0 #C4A000; cursor: pointer; z-index: 20001; }
        #quest-toggle-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #C4A000; }
        #quest-panel { position: absolute; top: 60px; right: 150px; pointer-events: auto; background: rgba(255,250,200,0.95); padding: 15px; border-radius: 15px; width: 280px; height: 35vh; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: 2px solid #E6C229; display: none; }
        
        .panel-title { text-align: center; font-weight: bold; font-size: 20px; margin-bottom: 12px; color: #333; border-bottom: 2px solid #ccc; padding-bottom: 8px; }
        
        .shop-item { display: flex; align-items: center; background: #fff; border: 2px solid #ddd; border-radius: 10px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; }
        .shop-item:active { transform: scale(0.98); }
        .shop-item .icon-box { width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; font-size: 40px; background: #f5f5f5; border-radius: 10px; margin-right: 12px; }
        .shop-item .icon-box img { max-width: 100%; max-height: 100%; }
        .shop-item .info { flex: 1; }
        .shop-item .name { font-weight: bold; font-size: 18px; color: #333; margin-bottom: 4px; }
        .shop-item .desc { font-size: 13px; color: #007BFF; margin-bottom: 6px; word-break: keep-all; line-height: 1.3; }
        .shop-item .cost { font-size: 14px; color: #666; font-weight: bold; display: flex; flex-wrap: wrap; gap: 6px; }
        .shop-item .cost span { display: flex; align-items: center; }
        .shop-item .cost img { width: 16px; height: 16px; margin-right: 4px; }

        .quest-item { background: #fff; border: 2px dashed #E6C229; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; font-weight: bold; }
        .quest-item.done { background: #d4edda; border-style: solid; border-color: #28a745; color: #155724; text-decoration: line-through; }
        .quest-title { color: #E6C229; margin-bottom: 3px; font-size: 14px; }
        .quest-item.done .quest-title { color: #28a745; }

        .modal-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 30000; display: none; justify-content: center; align-items: center; pointer-events: auto; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-content h2 { color: #FF5722; margin-bottom: 20px; word-break: keep-all; font-size: 22px; }
        .quiz-option { display: block; width: 100%; padding: 12px; margin: 10px 0; font-size: 18px; border: 2px solid #2196F3; background: #E3F2FD; border-radius: 12px; font-weight: bold; transition: all 0.2s; }
        .quiz-option:active { background: #2196F3; color: white; }
        .close-btn { margin-top: 15px; padding: 10px 25px; background: #9e9e9e; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; }

        #dict-btn { position: absolute; top: 80px; left: 15px; pointer-events: auto; background: #9C27B0; color: white; padding: 10px 20px; border-radius: 10px; font-weight: bold; font-size: 18px; border: 3px solid #7B1FA2; box-shadow: 0 4px 0 #4A148C; transition: all 0.1s; }
        #dict-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #4A148C; }
        
        .dict-entry { background: #f3e5f5; border-left: 5px solid #9C27B0; padding: 15px; margin-bottom: 10px; text-align: left; font-size: 16px; font-weight: bold; line-height: 1.4; }

        /* 건축물 기본 속성 */
        .building { position: absolute; user-select: none; touch-action: none; display: flex; justify-content: center; align-items: center; }
        .building.draggable { cursor: grab; }
        .building.draggable:active { cursor: grabbing; filter: brightness(1.1); }
        
        .size-1 { width: 30px; height: 30px; font-size: 20px; }
        .size-2 { width: 60px; height: 60px; font-size: 40px; }
        .size-3 { width: 90px; height: 90px; font-size: 50px; }

        .obj-3d { filter: drop-shadow(0 15px 10px rgba(0,0,0,0.3)); background: rgba(255,255,255,0.5); border: 2px dashed #aaa; border-radius: 10px; }
        .obj-3d.has-img { background: transparent; border: none; }
        .obj-tile { z-index: 5 !important; border: 1px dashed rgba(255,255,255,0.3); }
        
        /* 특수 기능 효과 */
        .oven-fire { position: absolute; bottom: 0; font-size: 40px; animation: flicker 0.5s infinite alternate; pointer-events: none; display: none; }
        @keyframes flicker { 0% { opacity: 0.8; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1.1); } }

        #alert-text { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); font-size: 28px; font-weight: bold; color: white; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; z-index: 40000; opacity: 0; pointer-events: none; transition: opacity 0.4s; text-align: center; line-height: 1.4; }
        
        /* 훈장 표시기 */
        #medals-container { position: absolute; top: 130px; left: 15px; display: flex; gap: 5px; font-size: 30px; pointer-events: none; z-index: 20000;}
        
        #zoom-controls { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 30000; pointer-events: auto; }
        .zoom-btn { background: rgba(255,255,255,0.95); border: 2px solid #555; border-radius: 12px; width: 55px; height: 55px; font-size: 26px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: transform 0.1s; display: flex; justify-content: center; align-items: center; }
        .zoom-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>
    <div id="viewport">
        <div id="game-board">
            <div id="volcano" class="obj-3d has-img"></div>
        </div>
        
        <div id="alert-text"></div>
        
        <div id="ui-layer">
            <div id="inventory">
                <div class="inv-item" onclick="showResInfo('gas', '화산 가스', '화산 분출물 중 기체 상태입니다. 대부분 수증기이고 이산화 탄소 등도 포함됩니다.')" style="cursor:help;" title="클릭하여 정보 보기"><img src="gas_processed.webp">화산 가스: <span id="inv-gas">0</span></div>
                <div class="inv-item" onclick="showResInfo('lava', '용암', '화산 분출물 중 액체 상태입니다. 마그마가 지표로 흘러나온 것으로, 식으면 암석이 됩니다.')" style="cursor:help;" title="클릭하여 정보 보기"><img src="lava_processed.webp">용암: <span id="inv-lava">0</span></div>
                <div class="inv-item" onclick="showResInfo('ash', '화산재', '화산 분출물 중 고체 상태입니다. 아주 작은 알갱이로 바람을 타고 멀리 날아갈 수 있으며, 나중에는 땅을 비옥하게 합니다.')" style="cursor:help;" title="클릭하여 정보 보기"><img src="ash_processed.webp">화산재: <span id="inv-ash">0</span></div>
                <div class="inv-item" onclick="showResInfo('rock', '화산 암석 조각', '화산 분출물 중 고체 상태입니다. 크기가 다양하며 화산탄 같은 큰 덩어리도 있습니다.')" style="cursor:help;" title="클릭하여 정보 보기"><img src="rock_processed.webp">암석 조각: <span id="inv-rock">0</span></div>
                <div class="inv-item" title="수확한 고구마"><span class="icon">🍠</span>고구마: <span id="inv-potato">0</span></div>
                <div class="inv-item" title="용암 군고구마"><span class="icon">🍕</span>군고구마: <span id="inv-roasted">0</span></div>
                <div class="inv-item" title="누적 관광객 (훈장 조건)"><span class="icon">👦</span>관광객: <span id="inv-tourists">0</span></div>
            </div>
            
            <button id="dict-btn" onclick="document.getElementById('dict-modal').style.display='flex'">📖 화산 도감</button>
            <div id="medals-container"></div>
            
            <button id="quest-toggle-btn" onclick="toggleQuest()">📜 퀘스트 열기</button>
            <button id="shop-toggle-btn" onclick="toggleShop()">🛒 상점 열기</button>
            <div id="shop">
                <div class="panel-title">상점 (드래그로 겹쳐짓기)</div>
                <div id="shop-items"></div>
            </div>
            
            <div id="quest-panel">
                <div class="panel-title">📜 진행중인 퀘스트</div>
                <div id="quest-items"></div>
            </div>
            
            <div id="zoom-controls">
                <button class="zoom-btn" onclick="changeZoom(0.2)">➕</button>
                <button class="zoom-btn" onclick="changeZoom(-0.2)">➖</button>
            </div>
        </div>
        
        <div id="quiz-modal" class="modal-bg">
            <div class="modal-content">
                <h2 id="quiz-q">질문</h2>
                <div id="quiz-options"></div>
                <button class="close-btn" onclick="document.getElementById('quiz-modal').style.display='none'">닫기</button>
            </div>
        </div>
        
        <div id="res-info-modal" class="modal-bg" style="z-index: 35000;" onclick="this.style.display='none'">
            <div class="modal-content" style="max-width: 400px; padding: 20px;" onclick="event.stopPropagation()">
                <div style="font-size: 50px; margin-bottom: 10px;" id="res-info-icon"></div>
                <h2 id="res-info-title" style="margin: 0 0 10px 0; color: #FF5722; font-size: 24px;">이름</h2>
                <div id="res-info-desc" style="font-size: 16px; font-weight: bold; color: #333; line-height: 1.5; margin-bottom: 20px; word-break: keep-all;">설명</div>
                <button class="close-btn" style="margin-top: 0;" onclick="document.getElementById('res-info-modal').style.display='none'">확인</button>
            </div>
        </div>
        
        <div id="dict-modal" class="modal-bg">
            <div class="modal-content">
                <h2>📖 나의 화산 도감</h2>
                <div id="dict-content" style="max-height: 40vh; overflow-y: auto;">
                    <div style="color:#666;">아직 해금된 도감이 없습니다. 퀘스트를 완료해보세요!</div>
                </div>
                <button class="close-btn" onclick="document.getElementById('dict-modal').style.display='none'">닫기</button>
            </div>
        </div>
    </div>

    <script>
        const inventory = { gas: 200, lava: 200, ash: 200, rock: 200, potato: 0, roasted: 0, tourists: 0 };
        const resTypes = ['gas', 'lava', 'ash', 'rock'];
        
        let placedBuildings = [];
        let quizzesAnswered = 0;
        let dayTick = 0; 
        
        // Panning logic
        let boardX = -1000; // Start at center-ish of 3000x3000 map
        let boardY = -1000;
        let zoomLevel = 1.0;
        const board = document.getElementById('game-board');
        
        function updateTransform() {
            board.style.transform = `translate(${boardX}px, ${boardY}px) scale(${zoomLevel})`;
        }
        updateTransform();
        
        function changeZoom(delta) {
            let oldZoom = zoomLevel;
            zoomLevel += delta;
            if(zoomLevel < 0.4) zoomLevel = 0.4;
            if(zoomLevel > 2.0) zoomLevel = 2.0;
            
            let cx = window.innerWidth / 2;
            let cy = window.innerHeight / 2;
            boardX = cx - (cx - boardX) * (zoomLevel / oldZoom);
            boardY = cy - (cy - boardY) * (zoomLevel / oldZoom);
            updateTransform();
        }
        
        let isPanning = false;
        let panStartX = 0, panStartY = 0;

        document.getElementById('viewport').addEventListener('mousedown', (e) => {
            if(e.target === board) {
                isPanning = true;
                panStartX = e.clientX - boardX;
                panStartY = e.clientY - boardY;
                board.style.cursor = 'grabbing';
            }
        });
        document.addEventListener('mousemove', (e) => {
            if(isPanning) {
                boardX = e.clientX - panStartX;
                boardY = e.clientY - panStartY;
                updateTransform();
            }
        });
        document.addEventListener('mouseup', () => {
            if(isPanning) {
                isPanning = false;
                board.style.cursor = '';
            }
        });
        
        document.getElementById('viewport').addEventListener('touchstart', (e) => {
            if(e.target === board) {
                isPanning = true;
                panStartX = e.touches[0].clientX - boardX;
                panStartY = e.touches[0].clientY - boardY;
            }
        }, {passive: false});
        document.addEventListener('touchmove', (e) => {
            if(isPanning) {
                e.preventDefault(); 
                boardX = e.touches[0].clientX - panStartX;
                boardY = e.touches[0].clientY - panStartY;
                updateTransform();
            }
        }, {passive: false});
        document.addEventListener('touchend', () => { isPanning = false; });

        const items = {
            // Size 1
            wall: { name: '현무암 돌담', type: '3d', size: 1, img: 'wall_processed.png', desc: '용암이 식어 굳어진 구멍 뚫린 암석', cost: { rock: 3, ash: 1 } },
            bomb: { name: '화산탄 조각상', type: '3d', size: 1, img: 'bomb_processed.png', desc: '공중에서 굳어진 커다란 화산 암석 조각', cost: { lava: 5, gas: 5 } },
            pillar: { name: '주상절리 육각 기둥', type: '3d', size: 1, img: 'pillar_processed.png', desc: '용암이 빠르게 식으면서 기둥 모양으로 굳어짐', cost: { lava: 5, rock: 5 } },
            
            // Size 2
            hot: { name: '천연 화산 온천', type: '3d', size: 2, img: 'hot_processed.webp', desc: '지하수가 마그마에 의해 데워져 솟아남', cost: { gas: 15, rock: 10 } },
            harubang: { name: '현무암 조각 공원', type: '3d', size: 2, img: 'harubang_processed.webp', desc: '현무암을 조각하여 만든 훌륭한 관광 자원', cost: { lava: 10, rock: 20 } },
            pond: { name: '부석 미니 연못', type: '3d', size: 2, img: 'pond_processed.png', desc: '가스가 빠져나가 구멍이 많은 가벼운 암석', cost: { gas: 15, rock: 5 } },
            oven: { name: '마그마 돌 화덕', type: '3d', size: 2, img: 'oven_processed.png', desc: '마그마의 뜨거운 열로 고구마를 구울 수 있는 화덕', cost: { lava: 15, rock: 5 } },
            sand: { name: '검은 모래 해변', type: '3d', size: 2, img: 'sand_processed.webp', desc: '현무암이 잘게 부서져 만들어진 검은 모래 해변', cost: { ash: 10, rock: 2 } },
            
            // Size 3
            farm: { name: '비옥한 화산재 농장', type: '3d', size: 3, img: 'farm_basic_processed.png', desc: '화산재가 흙에 섞여 땅을 걸름지게 함', cost: { ash: 25, lava: 5 } },
            castle: { name: '단단한 현무암 성곽', type: '3d', size: 3, img: 'castle_processed.webp', desc: '단단한 암석 조각들을 쌓아 만든 방어벽', cost: { lava: 20, rock: 25, ash: 5 } },
            power: { name: '지열 발전소', type: '3d', size: 3, img: 'power_processed.webp', desc: '마그마의 엄청난 열에너지로 전기를 생산', cost: { gas: 30, lava: 10 } },
            crater: { name: '분화구 호수', type: '3d', size: 3, img: 'crater_processed.webp', desc: '분화구(마그마가 나온 구멍)에 맑은 물이 고인 호수', cost: { ash: 5, rock: 5, gas: 5 } },
            garden: { name: '화산재 텃밭 타일', type: 'tile', size: 3, emoji: '🌱', desc: '화산 분출물 중 고체인 화산재 활용', cost: { ash: 15, gas: 5 } }
        };

        const quests = [
            { id: 'q1', title: '화산의 쉼터', desc: '온천 1개 건설', condition: () => countB('hot') >= 1, done: false, dict: '온천은 마그마에 데워진 솟아나는 물로, 피로를 풀어주고 훌륭한 관광 자원이 됩니다.' },
            { id: 'q5', title: '척척박사 전문가', desc: '화산 퀴즈 3번 정답', condition: () => quizzesAnswered >= 3, done: false, medal: '🎓', dict: '화산 분출물에는 기체(화산가스), 액체(용암), 고체(화산재, 화산 암석 조각) 3가지 상태가 모두 존재합니다.' },

        function updateYSorting(el) {
            if (el.dataset.group === 'tile') {
                el.style.zIndex = 5;
            } else {
                const rect = el.getBoundingClientRect();
                el.style.zIndex = el.offsetTop + el.offsetHeight;
            }
        }

        function isCollidingLocal(el1, el2) {
            const r1 = { left: el1.offsetLeft, top: el1.offsetTop, right: el1.offsetLeft + el1.offsetWidth, bottom: el1.offsetTop + el1.offsetHeight };
            const r2 = { left: el2.offsetLeft, top: el2.offsetTop, right: el2.offsetLeft + el2.offsetWidth, bottom: el2.offsetTop + el2.offsetHeight };
            return !(r1.right <= r2.left || r1.left >= r2.right || r1.bottom <= r2.top || r1.top >= r2.bottom);
        }

        function checkOverlap(el) {
            const vol = document.getElementById('volcano');
            if (isCollidingLocal(el, vol)) return true;
            
            for (let b of placedBuildings) {
                if (b.el === el) continue;
                if (isCollidingLocal(el, b.el)) return true;
            }
            return false;
        }

        let placingType = null;

        function buyBuilding(key, event) {
            if(event) event.stopPropagation();
            if(placingType) return showAlert("먼저 선택한 건물을 배치해주세요!");

            const item = items[key];
            let canBuy = true;
            for(let res in item.cost) {
                if(inventory[res] < item.cost[res]) canBuy = false;
            }

            if(canBuy) {
                for(let res in item.cost) inventory[res] -= item.cost[res];
                updateUI();
                
                placingType = key;
                shadow = document.createElement('div');
                shadow.className = `building draggable obj-${item.type} size-${item.size}`;
                shadow.dataset.key = key;
                shadow.dataset.group = item.type;
                
                if (item.img) {
                    shadow.style.background = `url('${item.img}') no-repeat center/contain`;
                    shadow.classList.add('has-img');
                } else {
                    shadow.innerHTML = `<span style="position:relative; z-index:2;">${item.emoji}</span>`;
                }
                
                if (key === 'oven') {
                    shadow.innerHTML += '<div class="oven-fire">🔥</div>';
                }
                
                shadow.style.opacity = '0.6';
                shadow.style.pointerEvents = 'none';
                
                let cx = (window.innerWidth / 2 - boardX) / zoomLevel;
                let cy = (window.innerHeight / 2 - boardY) / zoomLevel;
                
                let initX = Math.round((cx - shadow.offsetWidth/2) / 30) * 30;
                let initY = Math.round((cy - shadow.offsetHeight/2) / 30) * 30;
                shadow.style.left = initX + 'px';
                shadow.style.top = initY + 'px';
                
                board.appendChild(shadow);

                showAlert("자원이 부족합니다!");

        let draggingEl = null, startX, startY, initX, initY;
        function dragStart(e, b) {
            draggingEl = b;
            draggingEl.style.zIndex = 30000;
            if(e.type.includes('touch')) {
                startX = e.touches[0].clientX; startY = e.touches[0].clientY;
            } else {
                startX = e.clientX; startY = e.clientY;
            }
            initX = parseInt(b.style.left||0); initY = parseInt(b.style.top||0);
            e.stopPropagation();
        }
        
        window.addEventListener('mousemove', (e) => {
            if(!draggingEl) return;
            let dx = (e.clientX - startX) / zoomLevel; let dy = (e.clientY - startY) / zoomLevel;
            draggingEl.style.left = (Math.round((initX + dx)/30)*30) + 'px';
            draggingEl.style.top = (Math.round((initY + dy)/30)*30) + 'px';
        });
        window.addEventListener('mouseup', () => {
            if(draggingEl) { 
                if (checkOverlap(draggingEl)) {
                    showAlert("건물이 겹칩니다! 원래 자리로 되돌아갑니다.");
                    draggingEl.style.left = initX + 'px';
                    draggingEl.style.top = initY + 'px';
                }
                updateYSorting(draggingEl); 
                draggingEl = null; 
            }
        });
        
        window.addEventListener('touchmove', (e) => {
            if(!draggingEl) return;
            let dx = (e.touches[0].clientX - startX) / zoomLevel; let dy = (e.touches[0].clientY - startY) / zoomLevel;
            draggingEl.style.left = (Math.round((initX + dx)/30)*30) + 'px';

                    draggingEl.style.top = initY + 'px';
                }
                updateYSorting(draggingEl); 
                draggingEl = null; 
            }
        });

        function createParticle(type, startX, startY) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.dataset.res = type;
            p.style.background = `url('${type}_processed.webp') no-repeat center/contain`;
            p.style.left = startX + 'px'; p.style.top = startY + 'px';
            board.appendChild(p);
            
            const powers = placedBuildings.filter(b => b.key === 'power');
            if(powers.length > 0 && Math.random() > 0.4) {
                const target = powers[0].el;
                const tx = parseInt(target.style.left) + 75;
                const ty = parseInt(target.style.top) + 75;
                setTimeout(() => {
                    p.style.left = tx + 'px'; p.style.top = ty + 'px';
                    p.style.transform = 'scale(0.2)';
                    setTimeout(() => {
                        inventory[type]++; updateUI(); p.remove();
                    }, 1000);
                }, 50);
                return;
            }

            setTimeout(() => {
                const angle = Math.random() * Math.PI * 2;
                const dist = 50 + Math.random() * 250; 
                p.style.left = (startX + Math.cos(angle)*dist) + 'px';
                p.style.top = (startY + Math.sin(angle)*dist) + 'px';
            }, 50);

            p.addEventListener('mouseover', () => { if(isSweeping) checkCollection(p); });
            p.addEventListener('mousedown', () => checkCollection(p));
            p.addEventListener('touchstart', (e) => { e.preventDefault(); checkCollection(p); }, {passive: false});
            setTimeout(() => { if(p.parentNode) p.remove(); }, 15000);
        }

        function erupt(amountMultiplier = 1) {
            const vol = document.getElementById('volcano');
            vol.classList.add('shake');
            setTimeout(() => vol.classList.remove('shake'), 500);
            
            const startX = vol.offsetLeft;
            const startY = vol.offsetTop;

            const amount = 3 * amountMultiplier + Math.floor(Math.random() * 3 * amountMultiplier);
            for(let i=0; i<amount; i++) {
                createParticle(resTypes[Math.floor(Math.random() * resTypes.length)], startX, startY);
            }
        }

        function spawnTourist() {
            const edges = [
                {x: Math.random()*3000, y: -50},
                {x: Math.random()*3000, y: 3050},
                {x: -50, y: Math.random()*3000},
                {x: 3050, y: Math.random()*3000}
            ];
            const edge = edges[Math.floor(Math.random() * edges.length)];
            
            const t = document.createElement('div');
            t.className = 'tourist'; t.innerText = '👦';
            t.style.left = edge.x + 'px';
            t.style.top = edge.y + 'px';
            t.style.transition = 'left 1s linear, top 1s linear';
            board.appendChild(t);
            
            t.addEventListener('mousedown', () => checkCollection(t));
            t.addEventListener('mouseover', () => { if(isSweeping) checkCollection(t); });
            
            touristsList.push({ el: t, x: edge.x, y: edge.y, state: 'roaming', target: null, timer: 0 });
        }
        
        function getEmotionFor(key) {
            if (key === 'hot') return '♨️';
            if (key === 'farm' || key === 'oven') return '🤤';
            if (key === 'harubang' || key === 'castle') return '📸';
            return '👍';
        }
        
        function showEmotion(x, y, emoji) {
            const e = document.createElement('div');
            e.className = 'emotion';
            e.innerText = emoji;
            e.style.left = (x + 10) + 'px';
            e.style.top = (y - 30) + 'px';
            board.appendChild(e);
            setTimeout(() => e.remove(), 2000);
        }

        setInterval(() => {
            dayTick++;

            const maxTourists = placedBuildings.length * 2 + 3;
            if (touristsList.length < maxTourists && Math.random() < 0.3) {
                spawnTourist();
            }

            placedBuildings.forEach(b => {
                b.timer++;
                let threshold = b.el.dataset.upgraded === "true" ? 15 : 30;
                if(b.key === 'farm' && b.timer >= threshold) {
                    b.timer = 0;
                    const p = document.createElement('div');
                    p.className = 'crop'; p.innerText = '🍠';
                    p.style.left = (parseInt(b.el.style.left) + 30 + Math.random()*30) + 'px';
                    p.style.top = (parseInt(b.el.style.top) + Math.random()*30) + 'px';
                    p.addEventListener('mousedown', () => checkCollection(p));
                    p.addEventListener('mouseover', () => { if(isSweeping) checkCollection(p); });
                    board.appendChild(p);
                }
            });

            if(dayTick % 10 === 0) erupt(1);

        }, 1000);

        setInterval(() => {
            touristsList.forEach((t, i) => {
                if (!t) return;
                
                if (t.state === 'roaming') {
                    if (placedBuildings.length > 0 && Math.random() < 0.5) {
                        t.target = placedBuildings[Math.floor(Math.random() * placedBuildings.length)];
                        t.state = 'moving';
                    } else {
                        t.x += (Math.random()-0.5)*300;
                        t.y += (Math.random()-0.5)*300;
                        t.x = Math.max(0, Math.min(3000, t.x));
                        t.y = Math.max(0, Math.min(3000, t.y));
                        t.el.style.left = t.x + 'px';
                        t.el.style.top = t.y + 'px';
                    }
                } else if (t.state === 'moving') {
                    if (t.target && t.target.el.parentNode) {
                        const tx = parseInt(t.target.el.style.left) + t.target.el.offsetWidth/2;
                        const ty = parseInt(t.target.el.style.top) + t.target.el.offsetHeight/2;
                        
                        const dx = tx - t.x;
                        const dy = ty - t.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        
                        if (dist < 80) {
                            t.state = 'enjoying';
                            t.timer = 5; 
                            t.el.style.transition = 'none'; 
                        } else {
                            const speed = 100; 
                            const ratio = Math.min(1, speed / dist);
                            t.x += dx * ratio;
                            t.y += dy * ratio;
                            t.el.style.left = t.x + 'px';
                            t.el.style.top = t.y + 'px';
                        }
                    } else {
                        t.state = 'roaming';
                    }
                } else if (t.state === 'enjoying') {
                    t.timer--;
                    if (t.timer % 2 === 0) {
                        showEmotion(t.x, t.y, getEmotionFor(t.target.key));
                    }
                    if (t.timer <= 0) {
                        t.el.style.transition = 'left 1s linear, top 1s linear';
                        if (Math.random() < 0.4) {
                            t.state = 'leaving';
                        } else {
                            t.state = 'roaming'; 
                        }
                    }
                } else if (t.state === 'leaving') {
                    t.x += (t.x < 1500 ? -300 : 300);
                    t.y += (t.y < 1500 ? -300 : 300);
                    t.el.style.left = t.x + 'px';
                    t.el.style.top = t.y + 'px';
                    if (t.x < -200 || t.x > 3200 || t.y < -200 || t.y > 3200) {
                        t.el.remove();
                        touristsList[i] = null;
                    }
                }
            });
            touristsList = touristsList.filter(t => t !== null);
        }, 1000); 

        renderShop();
        updateUI();

    </script>
</body>
</html>
